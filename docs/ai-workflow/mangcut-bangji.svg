.h6 { animation-delay:8.75s; }
.h7 { animation-delay:10.50s; }
.h8 { animation-delay:12.25s; }
@keyframes dash { to { stroke-dashoffset:-24; } }
@keyframes glow { 0% { opacity:0; } 2% { opacity:1; } 11.50% { opacity:1; } 14.50% { opacity:0; } 100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .flow, .loop { animation:none; } .hl { animation:none; opacity:0; } }
