<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" role="img" aria-labelledby="t d">
<title id="t">개인 작업 관리자 — AI 작업 흐름</title>
<desc id="d">목표와 제약 정리에서 명세 작성, 설계 결정, 단계 계획, 구현, 검사, 검증, 승인과 커밋까지 9단계와, 승인 뒤 다음 단계 계획으로 돌아가는 되돌림 고리를 보여 주는 작업 흐름도.</desc>
<style>
svg { --bg:#F3F4EE; --ink:#1F3326; --acc:#5E7A4A; --fill:#C8D8A4; --line:#D5DACB; --panel:#FBFBF7; --mute:#4A5D4F; font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
@media (prefers-color-scheme: dark) { svg { --bg:#131712; --ink:#E5EADC; --acc:#9DB57F; --fill:#3D5230; --line:#2E372C; --panel:#1B2219; --mute:#B4BFA9; } }
.bg { fill:var(--bg); }
text { fill:var(--ink); font-size:14px; }
.ttl { font-size:20px; font-weight:800; }
.lg { font-size:12px; fill:var(--mute); }
.box { stroke-linejoin:round; }
.me { fill:var(--fill); stroke:var(--ink); stroke-width:2.5; }
.ai { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.check { fill:var(--panel); stroke:var(--acc); stroke-width:1.5; stroke-dasharray:5 4; }
.side { fill:none; stroke:var(--line); stroke-width:1.5; }
.bar { fill:var(--acc); }
.pill-me { fill:var(--ink); }
.pill-ai { fill:var(--acc); }
.pill-check { fill:var(--bg); stroke:var(--acc); stroke-width:1.2; stroke-dasharray:3 2; }
.pill-side { fill:var(--line); }
.pt { font-size:11.5px; font-weight:700; }
.pt-me { fill:var(--bg); }
.pt-ai { fill:var(--bg); }
.pt-check { fill:var(--ink); }
.pt-side { fill:var(--ink); }
.body { fill:var(--ink); }
.flow { fill:none; stroke:var(--acc); stroke-width:2; stroke-dasharray:6 6; animation:dash 1.2s linear infinite; }
.loop { fill:none; stroke:var(--acc); stroke-width:2; stroke-dasharray:3 5; animation:dash 1.2s linear infinite; }
.head { fill:var(--acc); }
.lpill { fill:var(--bg); stroke:var(--acc); stroke-width:1.2; }
.ltxt { font-size:12px; font-weight:700; }
.hl { fill:none; stroke:var(--acc); stroke-opacity:0.55; stroke-width:6; opacity:0; animation:glow 14.0s ease-in-out infinite; }
.h1 { animation-delay:0.00s; }
.h2 { animation-delay:1.56s; }
.h3 { animation-delay:3.11s; }
.h4 { animation-delay:4.67s; }
.h5 { animation-delay:6.22s; }
.h6 { animation-delay:7.78s; }
.h7 { animation-delay:9.33s; }
.h8 { animation-delay:10.89s; }
.h9 { animation-delay:12.44s; }
@keyframes dash { to { stroke-dashoffset:-24; } }
@keyframes glow { 0% { opacity:0; } 2% { opacity:1; } 10.11% { opacity:1; } 13.11% { opacity:0; } 100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .flow, .loop { animation:none; } .hl { animation:none; opacity:0; } }
</style>
