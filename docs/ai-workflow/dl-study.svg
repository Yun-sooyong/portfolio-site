.ltxt { font-size:12px; font-weight:700; }
.hl { fill:none; stroke:var(--acc); stroke-opacity:0.55; stroke-width:6; opacity:0; animation:glow 10.5s ease-in-out infinite; }
.h1 { animation-delay:0.00s; }
